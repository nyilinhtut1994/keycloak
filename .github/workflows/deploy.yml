name: Deploy Keycloak to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: chkeycloakacr
  CONTAINER_APP_NAME: keycloak-app
  RESOURCE_GROUP: cmhl-preprod-rg
  IMAGE_NAME: keycloak

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

    - name: Deploy to Azure Container Apps
      run: |
        # Enable system-assigned identity
        az containerapp identity assign \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --system-assigned
        
        # Configure registry with managed identity
        az containerapp registry set \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --server ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io \
          --identity system
        
        # Update container app
        az containerapp update \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --set-env-vars \
            KC_DB=postgres \
            KC_DB_URL_HOST=${{ secrets.DB_HOST }} \
            KC_DB_URL_DATABASE=${{ secrets.DB_NAME }} \
            KC_DB_USERNAME=${{ secrets.DB_USERNAME }} \
            KC_DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            KC_HOSTNAME=${{ secrets.KEYCLOAK_HOSTNAME }} \
            KC_PROXY=edge \
            KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }} \
            KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
