name: Publish Keycloak image to Amazon ECR

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Diagnose GitHub OIDC and AWS STS after authentication failure
        if: ${{ failure() && steps.aws-credentials.outcome == 'failure' }}
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          query = urlencode({"audience": "sts.amazonaws.com"})
          request = Request(f"{url}{separator}{query}", headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
              "Accept": "application/json",
          })
          with urlopen(request, timeout=15) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps({claim: claims[claim] for claim in ("iss", "aud", "sub")}))

          region = os.environ["AWS_REGION"]
          if not re.fullmatch(r"[a-z]{2}(?:-[a-z0-9]+)+-[0-9]+", region):
              raise SystemExit("AWS_REGION is missing or malformed")
          sts_body = urlencode({
              "Action": "AssumeRoleWithWebIdentity",
              "Version": "2011-06-15",
              "RoleArn": os.environ["AWS_ROLE_ARN"],
              "RoleSessionName": "GitHubActions",
              "WebIdentityToken": token,
              "DurationSeconds": 900,
          }).encode()
          for host in (f"sts.{region}.amazonaws.com", "sts.amazonaws.com"):
              result = {"endpoint": host}
              try:
                  with urlopen(f"https://{host}/", data=sts_body, timeout=15) as response:
                      result.update(status=response.status, request_id=response.headers.get("x-amzn-requestid"))
              except HTTPError as error:
                  result["status"] = error.code
                  with error:
                      try:
                          aws_error = ET.fromstring(error.read())
                      except ET.ParseError:
                          pass
                      else:
                          result["error_code"] = aws_error.findtext(".//{*}Code")
                          result["request_id"] = aws_error.findtext(".//{*}RequestId")
              except (URLError, TimeoutError) as error:
                  result["transport_error"] = type(error).__name__
              print(json.dumps(result))
          PY

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          : "${ECR_REPOSITORY:?Set the ECR_REPOSITORY repository variable}"
          image_tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag"
          docker build --tag "$image" .
          docker push "$image"
          printf 'ECR image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
