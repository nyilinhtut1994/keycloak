name: Publish Keycloak image to Amazon ECR

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Show GitHub OIDC claims after AWS authentication failure
        if: ${{ failure() && steps.aws-credentials.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          query = urlencode({"audience": "sts.amazonaws.com"})
          request = Request(f"{url}{separator}{query}", headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
              "Accept": "application/json",
          })
          with urlopen(request, timeout=15) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps({claim: claims[claim] for claim in ("iss", "aud", "sub")}))
          PY

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          : "${ECR_REPOSITORY:?Set the ECR_REPOSITORY repository variable}"
          image_tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag"
          docker build --tag "$image" .
          docker push "$image"
          printf 'ECR image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
