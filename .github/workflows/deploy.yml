name: Publish Keycloak image to Amazon ECR

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          : "${ECR_REPOSITORY:?Set the ECR_REPOSITORY repository variable}"
          image_tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag"
          docker build --tag "$image" .
          docker push "$image"
          printf 'ECR image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            latest_image="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            docker tag "$image" "$latest_image"
            docker push "$latest_image"
            printf 'ECR image for ECS: `%s`\n' "$latest_image" >> "$GITHUB_STEP_SUMMARY"
          fi
